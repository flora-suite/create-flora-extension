name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:ci
      - run: pnpm test --maxWorkers=100%

  generated-project:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack local SDK and generator
        shell: bash
        run: |
          mkdir artifacts
          pnpm --filter @flora-suite/extension pack --pack-destination artifacts
          pnpm --filter @flora-suite/create-flora-extension pack --pack-destination artifacts
      - name: Generate, install, lint, and package an extension
        shell: bash
        run: |
          generator="$(realpath "$(find artifacts -name '*create-flora-extension*.tgz' -print -quit)")"
          sdk="$(realpath "$(find artifacts -name 'flora-suite-extension-*.tgz' -print -quit)")"
          mkdir runner
          printf '{"name":"runner","private":true}\n' > runner/package.json
          pnpm --dir runner add -D "$generator"
          pnpm --dir runner exec create-flora-extension sample --skip-install
          pnpm --dir runner/sample add -D \
            "$generator" "$sdk" \
            @types/react@^18 @types/react-dom@^18 \
            css-loader@^7 eslint@^9 globals@^15 prettier@^3 react@^18 react-dom@^18 \
            style-loader@^4 ts-loader@^9 \
            typescript@^5 typescript-eslint@^8
          pnpm --dir runner/sample run lint
          pnpm --dir runner/sample run package
