name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @flora-suite/extension publish --access public --provenance --no-git-checks
      - run: pnpm --filter @flora-suite/schemas publish --access public --provenance --no-git-checks
      - run: pnpm --filter @flora-suite/create-flora-extension publish --access public --provenance --no-git-checks
